<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>爱东日常 ✨</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 登录页 -->
  <section id="login-view" class="view">
    <div class="card">
      <h1 class="title">爱东日常</h1>
      <p class="subtitle">输入昵称开始你的爱东日常 ✨</p>
      <form id="login-form">
        <input id="nickname-input" type="text" placeholder="给自己起个昵称" maxlength="20" required />
        <button type="submit">进入</button>
      </form>
      <p class="tip">数据按昵称隔离保存。同一昵称在任何设备上都能继续。</p>
    </div>
  </section>

  <!-- 主页面 -->
  <section id="main-view" class="view hidden">
    <header class="topbar">
      <div class="user">
        <span class="hi">嗨，</span>
        <strong id="display-name"></strong>
      </div>
      <div class="topbar-right">
        <button id="history-btn" class="text-btn" title="查看历史">📔 历史</button>
        <button id="logout-btn" class="text-btn">退出</button>
      </div>
    </header>

    <p id="today-date" class="today-date"></p>

    <!-- ====== 今日运势卡（A） ====== -->
    <section id="fortune-section" class="fortune-section">
      <!-- 未抽卡：抽卡入口 -->
      <div id="fortune-empty" class="fortune-empty">
        <div class="fortune-cover">
          <div class="cover-emoji">🔮</div>
          <p class="cover-hint">点一下，揭开你今天和东东的运势</p>
          <button id="draw-btn" class="primary-btn">抽今日运势</button>
        </div>
      </div>

      <!-- 已抽卡：展示运势卡 -->
      <article id="fortune-card" class="fortune-card hidden">
        <div class="fc-header">
          <span class="fc-mood" id="fc-mood-emoji">🌸</span>
          <div class="fc-mood-text">
            <span class="fc-mood-label">今日心情</span>
            <strong id="fc-mood-name">柔软</strong>
          </div>
          <div class="fc-stars" id="fc-stars">⭐</div>
        </div>
        <div class="fc-rows">
          <div class="fc-row">
            <span class="fc-key">宜</span>
            <span class="fc-val good" id="fc-good"></span>
          </div>
          <div class="fc-row">
            <span class="fc-key">忌</span>
            <span class="fc-val bad" id="fc-bad"></span>
          </div>
          <div class="fc-row">
            <span class="fc-key">幸运色</span>
            <span class="fc-val">
              <span class="color-dot" id="fc-color-dot"></span>
              <span id="fc-color-name"></span>
            </span>
          </div>
          <div class="fc-row">
            <span class="fc-key">幸运数字</span>
            <span class="fc-val" id="fc-number"></span>
          </div>
        </div>
        <p class="fc-motto" id="fc-motto"></p>
      </article>
    </section>

    <!-- ====== 每日小任务（E） ====== -->
    <h2 class="section-title">今日小任务</h2>
    <div class="task-grid">

      <!-- 任务 1：给东东留言 -->
      <article class="task-card" id="task-msg">
        <header class="tc-head">
          <span class="tc-emoji">💌</span>
          <span class="tc-name">给东东留言</span>
          <span class="tc-status" data-status></span>
        </header>
        <div class="tc-body">
          <textarea id="msg-input" rows="3" maxlength="200" placeholder="今天，想对东东说点什么？"></textarea>
          <button id="msg-save" class="ghost-btn">保存今日留言</button>
        </div>
      </article>

      <!-- 任务 2：连点应援 -->
      <article class="task-card" id="task-cheer">
        <header class="tc-head">
          <span class="tc-emoji">🎤</span>
          <span class="tc-name">连点应援</span>
          <span class="tc-status" data-status></span>
        </header>
        <div class="tc-body cheer-body">
          <button id="cheer-btn" class="cheer-btn">
            <span class="cheer-face" id="cheer-face">🌟</span>
            <span class="cheer-text">为东东应援！</span>
          </button>
          <p class="cheer-info">
            今日 <strong id="cheer-today">0</strong> · 累计 <strong id="cheer-total">0</strong>
          </p>
        </div>
      </article>

      <!-- 任务 3：抽今日语录 -->
      <article class="task-card" id="task-quote">
        <header class="tc-head">
          <span class="tc-emoji">✨</span>
          <span class="tc-name">今日语录</span>
          <span class="tc-status" data-status></span>
        </header>
        <div class="tc-body">
          <div id="quote-empty" class="quote-empty">
            <button id="quote-btn" class="ghost-btn">抽一句东东想对你说的话</button>
          </div>
          <blockquote id="quote-content" class="quote-content hidden"></blockquote>
        </div>
      </article>

    </div>
  </section>

  <!-- 历史抽屉 -->
  <div id="history-modal" class="modal hidden">
    <div class="modal-card history-card">
      <header class="history-head">
        <h3>📔 我的爱东日常</h3>
        <button id="history-close" class="text-btn">关闭</button>
      </header>
      <div class="history-tabs">
        <button class="tab-btn active" data-tab="fortunes">运势</button>
        <button class="tab-btn" data-tab="messages">留言</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
